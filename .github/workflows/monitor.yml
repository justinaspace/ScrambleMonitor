name: ScrambleUp Group B Monitor
on:
  schedule:
    - cron: '5-55/10 5-21 1-16 * *'   # Days 1-16: every 10 min, 07:00-23:00 Vilnius
    - cron: '5 4 28-31 * *'            # Last day: 07:00 Vilnius (summer EEST, UTC+3)
    - cron: '5 5 28-31 * *'            # Last day: 07:00 Vilnius (winter EET,  UTC+2)
    - cron: '5 12 28-31 * *'           # Last day: 15:00 Vilnius (summer EEST, UTC+3)
    - cron: '5 13 28-31 * *'           # Last day: 15:00 Vilnius (winter EET,  UTC+2)
    - cron: '0 9 28-31 * *'            # Last day: 12:00 Vilnius reserve alert (summer)
    - cron: '0 10 28-31 * *'           # Last day: 12:00 Vilnius reserve alert (winter)
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps
      - name: Run monitor
        env:
          SCRAMBLE_AUTH: ${{ secrets.SCRAMBLE_AUTH }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
