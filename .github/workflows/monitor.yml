name: ScrambleUp Group B Monitor
on:
  schedule:
    - cron: '5-55/10 5-19 1-10 * *'   # Days 1-10: every 10 min, 07:00-22:00 Vilnius
    - cron: '0 9 28-31 * *'            # Last day: 12:00 Vilnius reserve alert (summer EEST, UTC+3)
    - cron: '0 10 28-31 * *'           # Last day: 12:00 Vilnius reserve alert (winter EET,  UTC+2)
    - cron: '0 15 28-31 * *'           # Last day: 18:00 Vilnius check (summer EEST, UTC+3)
    - cron: '0 16 28-31 * *'           # Last day: 18:00 Vilnius check (winter EET,  UTC+2)
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run monitor
        env:
          SCRAMBLE_AUTH: ${{ secrets.SCRAMBLE_AUTH }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
