name: ScrambleUp Group B Monitor

on:
  schedule:
  # TEMPORARY TEST — remove after
    - cron: '45 7 * * *'
    # DAYS 1-16: every 10 min, active hours (07:00-23:00 Vilnius = UTC 05-21)
    - cron: '*/10 5-21 1-16 * *'
   # DAYS 1-16: 5 min boost gap-fill 12:00-12:55 Vilnius (UTC 10)
    - cron: '5,15,25,35,45,55 10 1-16 * *'
    # DAYS 17-20: every 30 min, active hours
    - cron: '*/30 5-21 17-20 * *'
    # DAYS 21-31: every 120 min, active hours
    - cron: '0 5,7,9,11,13,15,17,19,21 21-31 * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium

      - name: Install dependencies
        run: pip install requests playwright && playwright install chromium --with-deps

      - name: Run monitor
        env:
          SCRAMBLE_AUTH: ${{ secrets.SCRAMBLE_AUTH }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
