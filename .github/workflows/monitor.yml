name: ScrambleUp Group B Monitor

on:
  schedule:
    - cron: '*/10 3-20 * * *'   # every 10 min, 06:00-23:00 Vilnius (UTC 3-20)
    - cron: '*/5 10-11 * * *'   # every 5 min, 12:00-13:00 Vilnius (UTC 10-11)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium

      - name: Install dependencies
        run: pip install requests playwright && playwright install chromium --with-deps

      - name: Run monitor
        env:
          SCRAMBLE_AUTH: ${{ secrets.SCRAMBLE_AUTH }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
