name: ScrambleUp Group B Monitor

on:
  schedule:
    # Days 1-16: every 10 min (07:05–22:55 Vilnius = UTC 05:05–20:55)
    - cron: '5-55/10 5-21 1-16 * *'
    # Days 17-20: every 60 min
    - cron: '5 5-21 17-20 * *'
    # Days 21-31: 07:05 Vilnius (UTC 05:05)
    - cron: '5 5 21-31 * *'
    # Days 21-31: 15:05 Vilnius (UTC 13:05)
    - cron: '5 13 21-31 * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run monitor
        env:
          SCRAMBLE_AUTH: ${{ secrets.SCRAMBLE_AUTH }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
