name: Reserve Alert
on:
  schedule:
    - cron: '45 7 28-31 * *'
    - cron: '45 8 28-31 * *'
  workflow_dispatch:
jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run reserve alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python reserve_alert.py
